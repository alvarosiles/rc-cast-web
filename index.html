<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RC Cast TV - Web Receiver</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0D1B2A; overflow: hidden; }
    cast-media-player {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      --background-color: #0D1B2A;
    }
    #web {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      border: 0; background: #000;
      display: none;
    }
    #web.show { display: block; }
    #overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      font-family: "Roboto", Arial, sans-serif; color: #fff;
      pointer-events: none;
    }
    #overlay.hidden { display: none; }
    #overlay h1 { font-size: 42px; margin: 0 0 12px; font-weight: 500; }
    #overlay p  { font-size: 20px; color: #8ECAE6; margin: 0; }
    #err { color: #ff6b6b; font-size: 16px; margin-top: 16px; max-width: 80%; word-break: break-word; }
  </style>
</head>
<body>
  <cast-media-player></cast-media-player>
  <iframe id="web" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>

  <div id="overlay">
    <h1>RC Cast TV</h1>
    <p id="msg">Listo · Esperando conexión…</p>
    <p id="err"></p>
  </div>

  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script>
    const NS = 'urn:x-cast:com.rccast.web';

    const context = cast.framework.CastReceiverContext.getInstance();
    const playerManager = context.getPlayerManager();

    const overlay = document.getElementById('overlay');
    const msg = document.getElementById('msg');
    const err = document.getElementById('err');
    const web = document.getElementById('web');
    const mediaPlayer = document.querySelector('cast-media-player');

    const EV = cast.framework.events.EventType;

    function showOverlay(text, errorText) {
      overlay.classList.remove('hidden');
      msg.textContent = text || 'Listo · Esperando conexión…';
      err.textContent = errorText || '';
    }
    let webTimer = null;
    function showWeb(url) {
      // Mostrar la URL mientras carga
      showOverlay('Abriendo: ' + url);
      overlay.classList.remove('hidden');
      web.src = url;
      web.classList.add('show');
      mediaPlayer.style.display = 'none';

      // Si en 6s el iframe no disparó load, avisar (sitio bloquea iframe)
      clearTimeout(webTimer);
      webTimer = setTimeout(() => {
        showOverlay('La página no cargó',
          'El sitio probablemente bloquea iframes (X-Frame-Options/CSP). URL: ' + url);
        web.classList.remove('show');
      }, 6000);
    }
    web.addEventListener('load', () => {
      if (web.src && web.src !== 'about:blank') {
        clearTimeout(webTimer);
        overlay.classList.add('hidden');
      }
    });
    function showVideo() {
      web.classList.remove('show');
      web.src = 'about:blank';
      mediaPlayer.style.display = 'block';
      overlay.classList.add('hidden');
    }

    // --- Video (normal media LOAD) ---
    playerManager.addEventListener(EV.LOAD_START, () => {
      showVideo();
      msg.textContent = 'Cargando video…';
      err.textContent = '';
    });
    playerManager.addEventListener(EV.PLAYER_LOAD_COMPLETE, () => overlay.classList.add('hidden'));
    playerManager.addEventListener(EV.MEDIA_FINISHED, () => showOverlay());
    playerManager.addEventListener(EV.ERROR, (event) => {
      showOverlay('Error al reproducir',
        'code=' + (event.detailedErrorCode || '?') + '  reason=' + (event.reason || '?'));
    });

    // --- Web / YouTube (custom message) ---
    const options = new cast.framework.CastReceiverOptions();
    options.customNamespaces = { [NS]: cast.framework.system.MessageType.JSON };
    options.maxInactivity = 3600;

    context.addCustomMessageListener(NS, (event) => {
      const data = event.data || {};
      if (data.type === 'youtube' && data.id) {
        showWeb('https://www.youtube.com/embed/' + data.id +
                '?autoplay=1&playsinline=1&rel=0');
      } else if (data.type === 'web' && data.url) {
        showWeb(data.url);
      } else if (data.type === 'stop') {
        showVideo();
        showOverlay();
      }
    });

    context.start(options);
  </script>
</body>
</html>
