<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RC Cast TV - Web Receiver</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0D1B2A; overflow: hidden; }
    cast-media-player {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      --background-color: #0D1B2A;
    }
    #overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      font-family: "Roboto", Arial, sans-serif; color: #fff;
      pointer-events: none;
    }
    #overlay h1 { font-size: 42px; margin: 0 0 12px; font-weight: 500; }
    #overlay p  { font-size: 20px; color: #8ECAE6; margin: 0; }
    #err { color: #ff6b6b; font-size: 16px; margin-top: 16px; max-width: 80%; word-break: break-word; }
  </style>
</head>
<body>
  <cast-media-player></cast-media-player>

  <div id="overlay">
    <h1>RC Cast TV</h1>
    <p id="msg">Listo · Esperando conexión…</p>
    <p id="err"></p>
  </div>

  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script>
    const context = cast.framework.CastReceiverContext.getInstance();
    const playerManager = context.getPlayerManager();
    const overlay = document.getElementById('overlay');
    const msg = document.getElementById('msg');
    const err = document.getElementById('err');

    const EV = cast.framework.events.EventType;

    playerManager.addEventListener(EV.LOAD_START, () => {
      msg.textContent = 'Cargando video…';
      err.textContent = '';
    });

    playerManager.addEventListener(EV.PLAYER_LOAD_COMPLETE, () => {
      overlay.style.display = 'none';
    });

    playerManager.addEventListener(EV.MEDIA_FINISHED, () => {
      overlay.style.display = 'flex';
      msg.textContent = 'Listo · Esperando conexión…';
    });

    playerManager.addEventListener(EV.ERROR, (event) => {
      overlay.style.display = 'flex';
      msg.textContent = 'Error al reproducir';
      err.textContent = 'code=' + (event.detailedErrorCode || '?') +
                        '  reason=' + (event.reason || '?');
      console.error('CAF ERROR', event);
    });

    context.start();
  </script>
</body>
</html>
